<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1565c0">
<title>Gestionale Formatori</title>
<style>
:root{--blu:#1565c0;--blu2:#e8f1fc;--bg:#f4f7fb;--card:#fff;--txt:#17202e;--mut:#64748b;--brd:#e2e8f0;--ok:#22a55b;--ris:#e8a317;--no:#e5484d;--sv:#1f2937;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blu)}
.hidden{display:none!important}
/* barra */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top))}
.logo{width:34px;height:34px;border-radius:9px;background:var(--blu);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.brand{font-weight:700;line-height:1.1;font-size:14px}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav button{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--mut);white-space:nowrap;font-weight:500}
nav button.on{background:var(--blu2);color:var(--blu)}
nav .badge{background:var(--no);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
main{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.btn{border:1px solid var(--brd);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600}
.btn.p{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.d{color:var(--no);border-color:#f5c2c4}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=tel],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--brd);border-radius:9px;background:#fff}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2f7;color:#334155;margin:2px 4px 2px 0}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.muted{color:var(--mut)}
.small{font-size:13px}
.warn{color:#b45309;font-weight:600}
/* login */
.auth{max-width:420px;margin:7vh auto;padding:0 16px}
.auth .logo{width:56px;height:56px;font-size:22px;margin:0 auto 10px;border-radius:14px}
.auth h1{text-align:center;font-size:22px}.auth .sub{text-align:center}
.tabs{display:flex;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--txt);box-shadow:0 1px 2px #0001}
.privacy{font-size:12px;color:var(--mut);background:#f8fafc;border:1px solid var(--brd);border-radius:9px;padding:8px 10px;margin-top:10px;max-height:130px;overflow:auto}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px}
.check input{margin-top:3px}
/* calendario */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.calwrap{overflow:auto;border:1px solid var(--brd);border-radius:var(--r);background:#fff;max-height:calc(100vh - 230px)}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px}
table.cal th,table.cal td{border-right:1px solid #eef2f7;border-bottom:1px solid #eef2f7;padding:0;text-align:center}
table.cal thead th{position:sticky;top:0;background:#fff;z-index:3;font-weight:600;color:#475569}
table.cal thead tr:nth-child(2) th{top:26px}
table.cal thead tr:nth-child(3) th{top:52px}
table.cal .nm{position:sticky;left:0;background:#fff;z-index:2;text-align:left;padding:0 10px;min-width:170px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:34px}
table.cal thead .nm{z-index:4}
table.cal th.mese{height:26px;border-bottom:1px solid var(--brd);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
table.cal th.wk{min-width:34px;height:26px;font-size:11px}
table.cal th.wk.oggi{background:var(--blu);color:#fff;border-radius:6px 6px 0 0}
table.cal th.cbar{height:26px;padding:2px}
.cbar i{display:block;height:5px;border-radius:3px;margin:1px 0}
td.c{width:34px;height:34px;cursor:default}
td.c.can{cursor:pointer}
td.c.can:hover{outline:2px solid var(--blu);outline-offset:-2px}
tr.me .nm{font-weight:700;color:var(--blu)}
tr.me td.c{background-color:#f7fbff}
.q{font-size:10px;color:var(--mut);margin-left:4px;font-weight:500}
/* tabelle */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;border-bottom:1px solid var(--brd);padding:8px}
table.t td{border-bottom:1px solid #f1f5f9;padding:8px}
table.t td.n,table.t th.n{text-align:center}
.tscroll{overflow-x:auto}
/* corsi */
.corso{border-left:5px solid var(--blu)}
.corso h3{margin:0;font-size:17px}
.fsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:6px}
.fsel label{display:flex;align-items:center;gap:8px;margin:0;font-weight:500;border:1px solid var(--brd);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:14px}
.fsel label.sel{border-color:var(--blu);background:var(--blu2)}
/* formatori */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
/* modale e toast */
.ov{position:fixed;inset:0;background:#0f172a66;z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.modal h2{margin:0 0 10px;font-size:18px}
.stati{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stati button{border:2px solid var(--brd);background:#fff;border-radius:10px;padding:12px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.stati button.on{border-color:var(--blu);background:var(--blu2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw;font-size:14px}
#toast.err{background:#b91c1c}
@media(max-width:820px){
  header{flex-wrap:wrap}
  nav{order:3;width:100%;margin-left:0}
  .grid2{grid-template-columns:1fr}
  table.cal .nm{min-width:120px;max-width:130px}
  .calwrap{max-height:calc(100vh - 270px)}
}
</style>
</head>
<body>
<div id="app"><p style="text-align:center;margin-top:30vh;color:#64748b">Caricamento…</p></div>
<div id="toast" class="hidden"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
